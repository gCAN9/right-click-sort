<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Right-Click-Sort</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- View 1: URL entry -->
  <section id="entry-view" class="view">
    <h1 id="app-title">Right Click Sort</h1>
    <div id="profile-picker">
      <div class="picker-field">
        <input
          id="profile-input"
          type="text"
          placeholder="Search profile name, ENS or wallet address"
          spellcheck="false"
          autocomplete="off"
        />
        <div id="profile-results" class="dropdown" hidden></div>
      </div>
      <div id="collections-list" hidden></div>
    </div>
    <div class="or-divider">or</div>
    <div id="collection-picker">
      <div class="picker-field">
        <input
          id="collection-input"
          type="text"
          placeholder="Browse a whole collection — name or OpenSea URL"
          spellcheck="false"
          autocomplete="off"
        />
        <div id="collection-results" class="dropdown" hidden></div>
      </div>
    </div>
    <div id="entry-status" class="entry-status" hidden></div>
    <a id="credit" href="https://x.com/gcan9k" target="_blank" rel="noopener"><img src="punk1242.svg" alt="" />gcan</a>
  </section>

  <!-- View 2: workspace -->
  <section id="workspace-view" class="view" hidden>
    <header id="toolbar">
      <!-- Icons: Lucide (lucide.dev, ISC license), inlined -->
      <button id="back-btn" class="ghost" title="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <button id="undo-btn" class="ghost" title="Undo (Ctrl/Cmd+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      </button>
      <button id="redo-btn" class="ghost" title="Redo (Shift+Ctrl/Cmd+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
      </button>
      <div class="control">
        <label for="canvas-w">Canvas</label>
        <input id="canvas-w" type="number" min="200" max="8000" step="10" value="1200" />
        <span class="times">&times;</span>
        <input id="canvas-h" type="number" min="200" max="8000" step="10" value="1200" />
        <span class="unit">px</span>
      </div>
      <div class="control">
        <label for="bg-color">Background</label>
        <input id="bg-color" type="color" value="#ffffff" />
      </div>
      <div class="control grow">
        <label for="padding-range">Padding</label>
        <input id="padding-range" type="range" min="0" max="80" step="1" value="12" />
        <span id="padding-value" class="unit">12px</span>
      </div>
      <div class="control" id="add-control">
        <input
          id="add-search"
          type="text"
          placeholder="Add collection…"
          spellcheck="false"
          autocomplete="off"
        />
        <div id="add-results" class="dropdown" hidden></div>
      </div>
      <div class="control">
        <label>Auto</label>
        <button id="auto-grid" class="chip" title="Uniform grid that fills the canvas">Grid</button>
        <button id="auto-rows" class="chip" title="Justified rows spanning the full width">Rows</button>
        <button id="auto-mosaic" class="chip" title="Mixed sizes packed to fill the canvas">Mosaic</button>
      </div>
      <div class="split-btn" id="export-split">
        <button id="export-btn" class="primary">Save as picture</button>
        <button id="export-more" class="primary arrow" title="Export options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="export-menu" class="dropdown" hidden>
          <button type="button" class="dropdown-row" id="export-hires">
            <span>High-res export</span><span class="addr">3&times;, original images</span>
          </button>
        </div>
      </div>
    </header>
    <main id="canvas-scroller">
      <div id="canvas-wrap">
        <div id="canvas" class="canvas"></div>
      </div>
    </main>
    <div id="load-pill" hidden></div>
  </section>

  <script src="app.js"></script>
  <!-- Vercel Web Analytics + Speed Insights (no-ops outside Vercel deployments) -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
